services:
  plantdiseaseai-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: plantdiseaseai:latest
    container_name: plantdiseaseai_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - INFERENCE_DEVICE=cpu
    volumes:
      - plantdiseaseai_data:/app/backend/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  plantdiseaseai_data:
