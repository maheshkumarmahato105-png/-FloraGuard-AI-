services:
  floraguard-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: floraguard-ai:latest
    container_name: floraguard_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - CONFIDENCE_THRESHOLD=0.60
    volumes:
      - floraguard_data:/app/database
      - floraguard_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  floraguard_data:
  floraguard_uploads:
