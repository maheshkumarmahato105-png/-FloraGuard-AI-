# ==============================================================================
# PlantDiseaseAI — Verified Cross-Dataset Class Mapping Taxonomy
# Preserves original labels and dataset attribution while defining verified
# canonical classes across PlantVillage (primary) and PlantDoc (external eval).
#
# Policy:
#   - PlantVillage (38 classes) defines the primary canonical classification taxonomy.
#   - PlantDoc (28 folders in Pratikkayal/PlantDoc-Dataset) is mapped with explicit
#     verification notes and kept strictly separate as an external evaluation set.
#   - PlantSeg is reserved for future pixel-level segmentation research and is NOT
#     merged into classification splits.
# ==============================================================================

